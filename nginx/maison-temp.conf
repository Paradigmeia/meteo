# Format de journalisation sans query string, pour le webhook Shelly dont l'URL
# porte la clé d'API (contrainte firmware, cf. PLAN.md décision 6). Identique au
# format « combined » de nginx, à ceci près qu'il écrit $uri (chemin seul) au
# lieu de $request (méthode + URI complète + protocole). Issue #35.
log_format maison_temp_sans_parametres
    '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

# Zone de limitation de débit des routes de lecture (issue #60). Déclarée ici
# parce que limit_req_zone n'existe qu'en contexte http — ce fichier est inclus
# depuis http, comme le prouve le log_format ci-dessus. Déclarer une zone ne
# limite rien : seul le limit_req qui la référence agit, et il n'y en a qu'un,
# dans location /api/. Les autres sites de la machine ne sont pas concernés.
#
# 10r/s avec une rafale de 20, mesuré et non choisi au hasard :
#   - l'interface rafraîchit tout toutes les 30 s et la vue Analyse tire en
#     Promise.all, donc une rafale légitime est SIMULTANÉE — d'où nodelay, qui
#     la laisse passer sans la mettre en file, et une rafale large ;
#   - un chargement de page fait ~6 requêtes ; 20 couvre trois onglets qui se
#     rechargent en même temps derrière la même IP ;
#   - le maximum observé sur six mois d'access.log est de 5 req/s ;
#   - en régime établi, 10 req/s plafonne le coût qu'un client peut imposer à
#     la boucle d'événements (cf. décision 23).
limit_req_zone $binary_remote_addr zone=meteo_lectures:10m rate=10r/s;

server {
    listen 80;
    server_name meteo.paradigme.me;

    # Même masquage qu'en HTTPS : une action Shelly mal configurée en http://
    # se ferait rediriger, et la ligne de redirection porterait la clé (issue
    # #35). Mesuré : 2 requêtes sur 8 095 passent par ici, donc le cas existe.
    # Rien d'autre ne transite par ce bloc que le challenge ACME.
    access_log /var/log/nginx/access.log maison_temp_sans_parametres;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name meteo.paradigme.me;

    ssl_certificate /etc/letsencrypt/live/meteo.paradigme.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meteo.paradigme.me/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Rétablissement de l'IP client réelle (issue #60). Le site est derrière
    # Cloudflare : sans ceci, $binary_remote_addr est l'IP d'un nœud de bordure
    # Cloudflare, et la limitation de débit serait exactement à l'envers — elle
    # compterait ensemble des visiteurs sans rapport partageant un nœud, et
    # donnerait à un client unique autant de quotas qu'il traverse de nœuds
    # (202 IP de bordure distinctes relevées dans access.log).
    #
    # nginx n'accorde ce remplacement qu'aux pairs listés ci-dessous : une
    # requête arrivant en direct sur l'origine — qui est joignable, Cloudflare
    # est contournable ici — garde son IP réelle et son en-tête CF-Connecting-IP
    # est ignoré. Il n'y a donc pas d'usurpation possible.
    #
    # Volontairement dans ce bloc server et non en contexte http : ces
    # directives y vaudraient pour tous les sites de la machine.
    #
    # Plages relevées sur https://www.cloudflare.com/ips-v4 et ips-v6 le
    # 2026-08-30. Elles bougent rarement mais elles bougent : une plage ajoutée
    # par Cloudflare et absente d'ici ne casse rien de visible, elle fait
    # seulement retomber ce trafic sur l'IP de bordure. À revoir au fil des
    # sessions de maintenance.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # En-têtes de sécurité (issue #49). Attention : add_header n'est pas
    # cumulatif dans nginx. Un add_header posé dans un bloc location ANNULE
    # tous ceux hérités d'ici — si un location doit un jour en poser un, il
    # faut y recopier ce bloc entier.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    # Double emploi assumé avec frame-ancestors : X-Frame-Options couvre les
    # navigateurs qui ignorent CSP niveau 2.
    add_header X-Frame-Options "DENY" always;

    # Le frontend ne charge plus aucune ressource tierce depuis la PR #51
    # (icônes embarquées en SVG) : 'self' partout, sans aucune exception.
    #
    # Pas de 'unsafe-inline' en style-src, contrairement à ce que laissait
    # craindre l'issue #49. Les composants React écrivent leurs style={{ … }}
    # par le CSSOM (style.setProperty), pas par setAttribute('style', …) :
    # l'attribut apparaît bien dans le DOM mais n'a jamais été « posé », et la
    # CSP ne contrôle que la pose. Vérifié sous Chromium avec cette politique
    # exacte : les trois vues s'affichent, aucune violation.
    #
    # img-src sans data: — le build n'en produit aucun aujourd'hui. Attention,
    # Vite inline en data: URI tout asset importé de moins de 4 ko
    # (assetsInlineLimit) : la première image légère ajoutée serait bloquée
    # sans qu'aucune URL n'apparaisse dans le code source.
    #
    # form-action 'none' — aucun <form> aujourd'hui, et la directive ne retombe
    # pas sur default-src. L'authentification prévue en v2 devra l'assouplir si
    # elle passe par un <form method="post"> plutôt que par fetch.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'; object-src 'none'" always;

    # Webhook Shelly — journalisé sans les paramètres pour que la clé d'API ne
    # se retrouve pas en clair dans access.log. Préfixe plus long que /api/,
    # donc prioritaire ; « /api/releves/ » (lecture, au pluriel) ne correspond
    # pas et garde la journalisation complète.
    #
    # Le ^~ est load-bearing : sans lui, une location regex ajoutée un jour
    # (location ~ ^/api/) l'emporterait sur ce préfixe et le masquage
    # disparaîtrait sans un mot de nginx -t. Même famille de piège que
    # l'add_header de la décision 16, à l'autre bout du fichier.
    #
    # Aucun add_header ici, volontairement : un seul suffirait à annuler les six
    # en-têtes de sécurité hérités du bloc server (cf. commentaire plus haut).
    location ^~ /api/releve/ {
        access_log /var/log/nginx/access.log maison_temp_sans_parametres;

        # access_log ne couvre pas error_log, qui journalise l'URI complète
        # dans son contexte « request: ... » et « upstream: ... ». Un 502 le
        # déclenche, et le redémarrage du service en ouvre justement la fenêtre.
        # Relever le seuil à crit supprime ces lignes ici : on garde le fait
        # (l'access_log enregistre le 502, chemin masqué), on perd le détail.
        error_log /var/log/nginx/error.log crit;
        proxy_pass http://127.0.0.1:8042;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API → FastAPI (routes de LECTURE : /api/sondes, /api/releves/, /api/meteo)
    #
    # C'est le seul limit_req du fichier, et son emplacement est load-bearing.
    # Le webhook a sa propre location ^~ /api/releve/ juste au-dessus : les
    # locations sont exclusives, il n'hérite donc de rien d'ici. C'est
    # indispensable et pas seulement par principe — après le rétablissement de
    # l'IP réelle, le Shelly émet depuis l'IP publique du domicile, la MÊME que
    # les navigateurs de la maison. Un compteur partagé ferait donc jeter des
    # relevés par les gens en train de consulter le dashboard, soit exactement
    # la perte qu'on cherche à éviter (le Shelly n'émet qu'une fois, décision 6).
    #
    # Ne jamais déplacer ce limit_req dans le bloc server : il serait hérité par
    # toutes les locations, webhook compris.
    location /api/ {
        limit_req zone=meteo_lectures burst=20 nodelay;
        # 429 plutôt que le 503 par défaut : le client est en cause, pas le
        # serveur, et un 503 se confond avec une vraie panne dans les journaux.
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8042;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend React (build statique)
    root /home/debian/meteo/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

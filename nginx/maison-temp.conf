server {
    listen 80;
    server_name meteo.paradigme.me;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name meteo.paradigme.me;

    ssl_certificate /etc/letsencrypt/live/meteo.paradigme.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meteo.paradigme.me/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # En-têtes de sécurité (issue #49). Attention : add_header n'est pas
    # cumulatif dans nginx. Un add_header posé dans un bloc location ANNULE
    # tous ceux hérités d'ici — si un location doit un jour en poser un, il
    # faut y recopier ce bloc entier.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    # Double emploi assumé avec frame-ancestors : X-Frame-Options couvre les
    # navigateurs qui ignorent CSP niveau 2.
    add_header X-Frame-Options "DENY" always;

    # Le frontend ne charge plus aucune ressource tierce depuis la PR #51
    # (icônes embarquées en SVG), d'où un 'self' partout. Deux exceptions
    # documentées :
    #   - style-src-attr 'unsafe-inline' : les composants React posent des
    #     attributs style (style={{ … }}) que style-src bloquerait, et les
    #     graphiques SVG en dépendent. Le triplet style-src / -elem / -attr
    #     dégrade proprement : un navigateur qui ignore les directives
    #     granulaires retombe sur style-src, permissif pour les deux cas ;
    #     un navigateur récent applique -elem 'self', donc aucune balise
    #     <style> injectée ne passe.
    #   - aucune pour les scripts : Vite ne produit ni <script> ni <style>
    #     inline, script-src 'self' suffit.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; style-src-elem 'self'; style-src-attr 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'; object-src 'none'" always;

    # API → FastAPI
    location /api/ {
        proxy_pass http://127.0.0.1:8042;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend React (build statique)
    root /home/debian/meteo/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

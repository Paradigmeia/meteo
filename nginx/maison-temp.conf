server {
    listen 80;
    server_name meteo.paradigme.me;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name meteo.paradigme.me;

    ssl_certificate /etc/letsencrypt/live/meteo.paradigme.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meteo.paradigme.me/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # En-têtes de sécurité (issue #49). Attention : add_header n'est pas
    # cumulatif dans nginx. Un add_header posé dans un bloc location ANNULE
    # tous ceux hérités d'ici — si un location doit un jour en poser un, il
    # faut y recopier ce bloc entier.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    # Double emploi assumé avec frame-ancestors : X-Frame-Options couvre les
    # navigateurs qui ignorent CSP niveau 2.
    add_header X-Frame-Options "DENY" always;

    # Le frontend ne charge plus aucune ressource tierce depuis la PR #51
    # (icônes embarquées en SVG) : 'self' partout, sans aucune exception.
    #
    # Pas de 'unsafe-inline' en style-src, contrairement à ce que laissait
    # craindre l'issue #49. Les composants React écrivent leurs style={{ … }}
    # par le CSSOM (style.setProperty), pas par setAttribute('style', …) :
    # l'attribut apparaît bien dans le DOM mais n'a jamais été « posé », et la
    # CSP ne contrôle que la pose. Vérifié sous Chromium avec cette politique
    # exacte : les trois vues s'affichent, aucune violation.
    #
    # img-src sans data: — le build n'en produit aucun aujourd'hui. Attention,
    # Vite inline en data: URI tout asset importé de moins de 4 ko
    # (assetsInlineLimit) : la première image légère ajoutée serait bloquée
    # sans qu'aucune URL n'apparaisse dans le code source.
    #
    # form-action 'none' — aucun <form> aujourd'hui, et la directive ne retombe
    # pas sur default-src. L'authentification prévue en v2 devra l'assouplir si
    # elle passe par un <form method="post"> plutôt que par fetch.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'; object-src 'none'" always;

    # API → FastAPI
    location /api/ {
        proxy_pass http://127.0.0.1:8042;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend React (build statique)
    root /home/debian/meteo/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

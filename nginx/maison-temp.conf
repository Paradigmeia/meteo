# Format de journalisation sans query string, pour le webhook Shelly dont l'URL
# porte la clé d'API (contrainte firmware, cf. PLAN.md décision 6). Identique au
# format « combined » de nginx, à ceci près qu'il écrit $uri (chemin seul) au
# lieu de $request (méthode + URI complète + protocole). Issue #35.
log_format maison_temp_sans_parametres
    '$realip_remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

# Format « combined » à l'identique, à ceci près qu'il écrit $realip_remote_addr
# — l'adresse du pair — là où combined écrit $remote_addr, que le rétablissement
# d'IP remplace désormais par celle du client réel (issue #60).
#
# CrowdSec lit /var/log/nginx/*.log et sa whitelist CDN neutralise aujourd'hui
# les IP de bordure. Écrire l'IP client réelle rendrait ces lignes éligibles aux
# scénarios, pour un bénéfice nul — le bouncer bloque en nftables, or le trafic
# HTTP arrive par les IP de Cloudflare, donc un bannissement ne filtrerait rien
# — et un risque réel : l'IP publique du domicile deviendrait bannissable, et le
# blocage nftables couperait TOUT le trafic entrant depuis la maison, SSH
# compris. La limitation de débit a besoin de l'IP réelle ; les journaux, non.
# Le périmètre de cette PR reste donc la limitation, et rien d'autre.
log_format maison_temp_bordure
    '$realip_remote_addr - $remote_user [$time_local] "$request" '
    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

# Limitation de débit (issue #60). Les zones sont déclarées ici parce que
# limit_req_zone n'existe qu'en contexte http — ce fichier est inclus depuis
# http, comme le prouve le log_format ci-dessus. Déclarer une zone ne limite
# rien : seuls les limit_req qui les référencent agissent, et il y en a
# exactement deux, un par location d'API. Les autres sites de la machine ne
# sont pas concernés (seule autre zone sur cette machine : `auth`, dans
# /etc/nginx/conf.d/rate-limit.conf — pas de collision de nom).
#
# 10r/s avec une rafale de 20, mesuré et non choisi au hasard :
#   - l'interface rafraîchit tout toutes les 30 s et la vue Analyse tire en
#     Promise.all, donc une rafale légitime est SIMULTANÉE — d'où nodelay, qui
#     la laisse passer sans la mettre en file, et une rafale large ;
#   - un chargement de page fait ~6 requêtes ; 20 couvre trois onglets qui se
#     rechargent en même temps derrière la même IP ;
#   - le maximum observé sur six mois d'access.log est de 5 req/s ;
#   - en régime établi, 10 req/s plafonne le coût qu'un client peut imposer à
#     la boucle d'événements (cf. décision 23).
# Clé de limitation. PAS $binary_remote_addr : sur seize octets, il distingue
# les /128, et un client disposant d'un /64 — l'allocation résidentielle
# standard — aurait 2^64 seaux. Vérifié : 60 requêtes depuis 60 adresses d'un
# même /64 passaient toutes, quand une seule adresse était bien limitée.
# Les quatre premiers groupes identifient le /64 ; les trois formes compressées
# (`A:B:C::`, `A:B::`, `A::`) désignent des /64 dont les groupes de queue sont
# nuls, et sont donc traitées séparément. L'IPv4 passe par `default`.
map $remote_addr $meteo_client {
    "~*^(?<prefixe4>[0-9a-f]+:[0-9a-f]+:[0-9a-f]+:[0-9a-f]+):"  $prefixe4;
    "~*^(?<prefixe3>[0-9a-f]+:[0-9a-f]+:[0-9a-f]+)::"           $prefixe3;
    "~*^(?<prefixe2>[0-9a-f]+:[0-9a-f]+)::"                     $prefixe2;
    "~*^(?<prefixe1>[0-9a-f]+)::"                               $prefixe1;
    default                                                      $remote_addr;
}

limit_req_zone $meteo_client zone=meteo_lectures:10m rate=10r/s;

# Le webhook a son propre compteur, et surtout pas celui des lectures : après le
# rétablissement d'IP, le Shelly émet depuis l'IP publique du domicile, la même
# que les navigateurs de la maison — un compteur partagé ferait jeter des relevés
# par les gens en train de consulter le dashboard.
#
# Mais « pas le même compteur » ne veut pas dire « aucun compteur ». Laisser
# cette location sans limitation, c'est laisser un chemin non authentifié et sans
# borne vers la même boucle d'événements mono-worker que celle qu'on protège.
# Le Shelly émet 107 relevés/jour, soit 0,0012 req/s : 2r/s laisse un facteur
# 1600, et une requête de webhook est un simple INSERT, sans agrégation.
limit_req_zone $meteo_client zone=meteo_webhook:1m rate=2r/s;

server {
    listen 80;
    server_name meteo.paradigme.me;

    # Même masquage qu'en HTTPS : une action Shelly mal configurée en http://
    # se ferait rediriger, et la ligne de redirection porterait la clé (issue
    # #35). Mesuré : 2 requêtes sur 8 095 passent par ici, donc le cas existe.
    # Rien d'autre ne transite par ce bloc que le challenge ACME.
    access_log /var/log/nginx/access.log maison_temp_sans_parametres;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name meteo.paradigme.me;

    ssl_certificate /etc/letsencrypt/live/meteo.paradigme.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meteo.paradigme.me/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Explicite, là où ce bloc héritait du format « combined » par défaut : sans
    # cette ligne, le rétablissement d'IP ci-dessous changerait ce qu'écrivent
    # ces journaux, et donc ce que CrowdSec y voit (cf. commentaire du format).
    access_log /var/log/nginx/access.log maison_temp_bordure;

    # Rétablissement de l'IP client réelle (issue #60). Le site est derrière
    # Cloudflare : sans ceci, $binary_remote_addr est l'IP d'un nœud de bordure
    # Cloudflare, et la limitation de débit serait exactement à l'envers — elle
    # compterait ensemble des visiteurs sans rapport partageant un nœud, et
    # donnerait à un client unique autant de quotas qu'il traverse de nœuds
    # (202 IP de bordure distinctes relevées dans access.log).
    #
    # nginx n'accorde ce remplacement qu'aux pairs listés ci-dessous : une
    # requête arrivant en direct sur l'origine — qui est joignable, Cloudflare
    # est contournable ici — garde son IP réelle et son en-tête CF-Connecting-IP
    # est ignoré. Il n'y a donc pas d'usurpation possible.
    #
    # Volontairement dans ce bloc server et non en contexte http : ces
    # directives y vaudraient pour tous les sites de la machine.
    #
    # Plages relevées sur https://www.cloudflare.com/ips-v4 et ips-v6 le
    # 2026-08-30. Elles bougent rarement mais elles bougent, et les deux sens de
    # l'erreur comptent : une plage MANQUANTE fait retomber ce trafic sur l'IP de
    # bordure — c'est-à-dire précisément le mode de défaillance décrit plus haut,
    # tous les clients d'un même nœud partageant un seul seau. Une plage EN TROP,
    # réattribuée à un tiers, laisserait ce tiers forger son CF-Connecting-IP et
    # contourner la limitation. À revoir au fil des sessions de maintenance.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # En-têtes de sécurité (issue #49). Attention : add_header n'est pas
    # cumulatif dans nginx. Un add_header posé dans un bloc location ANNULE
    # tous ceux hérités d'ici — si un location doit un jour en poser un, il
    # faut y recopier ce bloc entier.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    # Double emploi assumé avec frame-ancestors : X-Frame-Options couvre les
    # navigateurs qui ignorent CSP niveau 2.
    add_header X-Frame-Options "DENY" always;

    # Déclare que le site n'a besoin d'aucune de ces API (issue #54). Ça ne
    # bloque rien d'atteignable aujourd'hui — un navigateur n'accorde jamais ces
    # permissions sans appel explicite, et il n'y a pas d'iframe ici. L'intérêt
    # est le même que celui de la CSP, un cran plus bas : rattraper un code tiers
    # introduit plus tard, et documenter le périmètre du site.
    #
    # `interest-cohort=()` (FLoC) n'y figure pas : la fonctionnalité est
    # abandonnée, et une liste qui ne contient que du vivant se relit.
    #
    # Attention à `geolocation=()` si la v2 utilise la position du navigateur :
    # la météo d'Ascain est aujourd'hui codée côté serveur, mais une évolution
    # qui voudrait la position réelle serait bloquée ici — et le message d'erreur
    # du navigateur ne pointerait pas vers cet en-tête.
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;

    # Le frontend ne charge plus aucune ressource tierce depuis la PR #51
    # (icônes embarquées en SVG) : 'self' partout, sans aucune exception.
    #
    # Pas de 'unsafe-inline' en style-src, contrairement à ce que laissait
    # craindre l'issue #49. Les composants React écrivent leurs style={{ … }}
    # par le CSSOM (style.setProperty), pas par setAttribute('style', …) :
    # l'attribut apparaît bien dans le DOM mais n'a jamais été « posé », et la
    # CSP ne contrôle que la pose. Vérifié sous Chromium avec cette politique
    # exacte : les trois vues s'affichent, aucune violation.
    #
    # img-src sans data: — le build n'en produit aucun aujourd'hui. Attention,
    # Vite inline en data: URI tout asset importé de moins de 4 ko
    # (assetsInlineLimit) : la première image légère ajoutée serait bloquée
    # sans qu'aucune URL n'apparaisse dans le code source.
    #
    # form-action 'none' — aucun <form> aujourd'hui, et la directive ne retombe
    # pas sur default-src. L'authentification prévue en v2 devra l'assouplir si
    # elle passe par un <form method="post"> plutôt que par fetch.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'; object-src 'none'" always;

    # Webhook Shelly — journalisé sans les paramètres pour que la clé d'API ne
    # se retrouve pas en clair dans access.log. Préfixe plus long que /api/,
    # donc prioritaire ; « /api/releves/ » (lecture, au pluriel) ne correspond
    # pas et garde la journalisation complète.
    #
    # Le ^~ est load-bearing : sans lui, une location regex ajoutée un jour
    # (location ~ ^/api/) l'emporterait sur ce préfixe et le masquage
    # disparaîtrait sans un mot de nginx -t. Même famille de piège que
    # l'add_header de la décision 16, à l'autre bout du fichier.
    #
    # Aucun add_header ici, volontairement : un seul suffirait à annuler les six
    # en-têtes de sécurité hérités du bloc server (cf. commentaire plus haut).
    location ^~ /api/releve/ {
        access_log /var/log/nginx/access.log maison_temp_sans_parametres;

        # access_log ne couvre pas error_log, qui journalise l'URI complète
        # dans son contexte « request: ... » et « upstream: ... ». Un 502 le
        # déclenche, et le redémarrage du service en ouvre justement la fenêtre.
        # Relever le seuil à crit supprime ces lignes ici : on garde le fait
        # (l'access_log enregistre le 502, chemin masqué), on perd le détail.
        error_log /var/log/nginx/error.log crit;

        # Compteur propre au webhook, très large (cf. la zone). Il ne s'agit pas
        # de brider le Shelly — 1600x sa cadence — mais de ne pas laisser un
        # chemin non authentifié atteindre la boucle sans aucune borne.
        limit_req zone=meteo_webhook burst=50 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8042;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API → FastAPI (routes de LECTURE : /api/sondes, /api/releves/, /api/meteo)
    #
    # L'emplacement de ce limit_req est load-bearing : il doit rester DANS cette
    # location et ne jamais monter dans le bloc server.
    # Le webhook a sa propre location ^~ /api/releve/ juste au-dessus : les
    # locations sont exclusives, il n'hérite donc de rien d'ici (il a son propre
    # compteur, bien plus large). C'est indispensable et pas seulement par
    # principe — après le rétablissement de
    # l'IP réelle, le Shelly émet depuis l'IP publique du domicile, la MÊME que
    # les navigateurs de la maison. Un compteur partagé ferait donc jeter des
    # relevés par les gens en train de consulter le dashboard, soit exactement
    # la perte qu'on cherche à éviter (le Shelly n'émet qu'une fois, décision 6).
    #
    # Ne jamais déplacer ce limit_req dans le bloc server : il serait hérité par
    # toutes les locations, webhook compris.
    location /api/ {
        limit_req zone=meteo_lectures burst=20 nodelay;
        # 429 plutôt que le 503 par défaut : le client est en cause, pas le
        # serveur, et un 503 se confond avec une vraie panne dans les journaux.
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8042;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend React (build statique)
    root /home/debian/meteo/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

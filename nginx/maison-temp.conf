server {
    listen 80;
    server_name meteo.paradigme.me;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name meteo.paradigme.me;

    ssl_certificate /etc/letsencrypt/live/meteo.paradigme.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meteo.paradigme.me/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header X-Robots-Tag "noindex, nofollow" always;

    # API → FastAPI
    location /api/ {
        proxy_pass http://127.0.0.1:8042;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend React (build statique)
    root /home/debian/meteo/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
